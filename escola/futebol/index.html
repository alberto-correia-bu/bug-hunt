<title>Anagrama do Futebol</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eaf7ee,#d9efe1);color:#173b27}
.wrap{max-width:1000px;margin:auto;padding:22px}.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
h1{text-align:center;margin:0 0 6px;font-size:34px}.sub{text-align:center;color:#55705f}.top{display:flex;justify-content:space-between;flex-wrap:wrap}
.photo{width:100%;height:280px;object-fit:contain;border-radius:18px;background:#e7eee9;margin:15px 0}
.hint{text-align:center;font-size:18px}.slots{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin:15px 0}
.slot{width:54px;height:58px;border:3px dashed #a8c2b0;border-radius:12px;background:#f7fbf8;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;cursor:pointer}
.slot.filled{border-style:solid;border-color:#6a9b78;background:#edf7ef}.slot.fixed{background:#ccebd3;border-color:#2d8a48;color:#155b2b;cursor:default}
.bank{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;padding:14px;border-radius:18px;background:#f1f5f2;min-height:74px}
.letter{width:50px;height:50px;border:0;border-radius:12px;background:#fff;box-shadow:0 3px 9px rgba(0,0,0,.12);font-size:25px;font-weight:800;color:#194b2d;cursor:pointer}
.actions{text-align:center;margin-top:18px}button{border:0;border-radius:13px;padding:13px 22px;font-size:18px;font-weight:800;cursor:pointer;margin:4px}
#check{background:#19733b;color:#fff}#next{background:#e6b93f;color:#3f3000;display:none}#restart{background:#e9eeee;color:#284233}
button:disabled{opacity:.45}.msg{text-align:center;min-height:30px;font-size:19px;font-weight:700}.small{text-align:center;font-size:14px;color:#607365}
</style></head><body><div class="wrap"><div class="card">
<h1>⚽ ANAGRAMA DO FUTEBOL</h1><p class="sub">Observe a foto e organize as letras.</p>
<div class="top"><b id="progress"></b><b id="score"></b></div>
<img id="photo" class="photo" alt="">
<p class="hint">Coloque <b>TODAS</b> as letras e depois clique em <b>VERIFICAR</b>.</p>
<div id="slots" class="slots"></div><div id="bank" class="bank"></div>
<div class="actions"><button id="check">VERIFICAR</button><button id="next">PRÓXIMA PALAVRA ➜</button><button id="restart">RECOMEÇAR</button></div>
<div id="msg" class="msg"></div><p class="small">As letras certas permanecem no lugar. As erradas voltam para a área de letras.</p>
</div></div>

let idx=0,solved=0,slots=[],bank=[];
const $=id=>document.getElementById(id);
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function loadWord(){
 const item=words[idx];slots=item.w.split("").map(()=>({letter:null,fixed:false}));
 bank=shuffle(item.w.split("").map((ch,i)=>({id:i,ch})));
 $("photo").src=item.img;$("photo").alt=item.alt;
 $("progress").textContent=`Palavra ${idx+1} de ${words.length}`;$("score").textContent=`Palavras: ${solved}/${words.length}`;
 $("msg").textContent="";$("check").style.display="inline-block";$("next").style.display="none";render();
}
function render(){
 const s=$("slots"),b=$("bank");s.innerHTML="";
 slots.forEach((slot,i)=>{
   const el=document.createElement("div");el.className="slot"+(slot.letter!==null?" filled":"")+(slot.fixed?" fixed":"");el.textContent=slot.letter??"";
   if(slot.letter!==null&&!slot.fixed)el.onclick=()=>{bank.push({id:Date.now()+Math.random(),ch:slot.letter});slot.letter=null;render()};
   s.appendChild(el);
 });
 b.innerHTML="";
 bank.forEach(item=>{
   const el=document.createElement("button");el.className="letter";el.textContent=item.ch;
   el.onclick=()=>{const pos=slots.findIndex(x=>x.letter===null&&!x.fixed);if(pos<0)return;slots[pos].letter=item.ch;bank=bank.filter(x=>x!==item);render()};
   b.appendChild(el);
 });
 $("check").disabled=slots.some(x=>x.letter===null);
}
$("check").onclick=()=>{
 if(slots.some(x=>x.letter===null))return;
 let correct=0;
 slots.forEach((slot,i)=>{
   if(slot.letter===words[idx].w[i]){slot.fixed=true;correct++}
   else{bank.push({id:Date.now()+Math.random(),ch:slot.letter});slot.letter=null}
 });
 if(correct===words[idx].w.length){
   solved++;$("score").textContent=`Palavras: ${solved}/${words.length}`;$("msg").textContent="🎉 Muito bem! A palavra está correta!";
   $("check").style.display="none";$("next").style.display="inline-block";
 }else $("msg").textContent="Algumas letras ficaram no lugar certo. Tente novamente com as outras.";
 render();
};
$("next").onclick=()=>{if(idx<words.length-1){idx++;loadWord()}else{$("msg").textContent="🏆 Você completou todas as palavras!";$("next").style.display="none";$("check").style.display="none"}};
$("restart").onclick=()=>{idx=0;solved=0;loadWord()};loadWord();
</script></body></html>
