<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo dos Animais da Fazenda</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif;
    background: linear-gradient(135deg, #fff8df, #e9f7e8);
    color: #3b3b3b;
    min-height: 100vh;
  }
  .app {
    width: min(1000px, 94vw);
    margin: 0 auto;
    padding: 24px 0 32px;
    text-align: center;
  }
  h1 {
    margin: 4px 0 6px;
    font-size: clamp(28px, 5vw, 44px);
    color: #3f6f43;
  }
  .instructions {
    margin: 0 auto 18px;
    font-size: clamp(17px, 2.5vw, 22px);
    line-height: 1.35;
  }
  .card {
    background: rgba(255,255,255,.94);
    border-radius: 28px;
    padding: 20px;
    box-shadow: 0 8px 28px rgba(60,70,40,.13);
  }
  .photo-wrap {
    width: min(650px, 100%);
    height: min(390px, 48vw);
    min-height: 260px;
    margin: 0 auto 18px;
    border-radius: 22px;
    overflow: hidden;
    background: #f3f0df;
  }
  .photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .progress {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 10px;
    color: #6b6b6b;
  }
  .slots {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin: 10px auto 18px;
  }
  .slot {
    width: clamp(44px, 8vw, 64px);
    height: clamp(52px, 9vw, 70px);
    border: 3px solid #7ca66e;
    border-radius: 14px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(25px, 5vw, 38px);
    font-weight: 900;
  }
  .slot.filled {
    background: #edf7e9;
    color: #315d35;
  }
  .letters {
    display: flex;
    justify-content: center;
    gap: 9px;
    flex-wrap: wrap;
    max-width: 760px;
    margin: 0 auto;
  }
  .letter {
    width: clamp(48px, 8vw, 66px);
    height: clamp(48px, 8vw, 66px);
    border: 0;
    border-radius: 16px;
    background: #f1c85b;
    color: #3f351b;
    font-size: clamp(23px, 4vw, 32px);
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 0 #c79c2e;
    transition: transform .12s, opacity .12s, box-shadow .12s;
    touch-action: manipulation;
  }
  .letter:hover { transform: translateY(-2px); }
  .letter:active { transform: translateY(2px); box-shadow: 0 1px 0 #c79c2e; }
  .letter.used {
    opacity: .35;
    cursor: default;
    box-shadow: none;
  }
  .letter.wrong {
    animation: shake .28s;
    background: #f4a7a7;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .feedback {
    min-height: 34px;
    margin: 13px 0 8px;
    font-size: 20px;
    font-weight: bold;
  }
  .feedback.ok { color: #3f7a43; }
  .feedback.no { color: #b45a45; }
  .controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .control {
    border: 0;
    border-radius: 14px;
    padding: 12px 18px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    background: #dcebd7;
    color: #315d35;
  }
  .control.next {
    background: #6d9b61;
    color: white;
  }
  .control:disabled {
    opacity: .45;
    cursor: default;
  }
  .celebrate {
    animation: pop .4s ease;
  }
  @keyframes pop {
    0% { transform: scale(.96); }
    60% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }
  .tip {
    margin-top: 18px;
    font-size: 15px;
    color: #6c6c6c;
  }
</style>
</head>
<body>
<div class="app">
  <h1>🐄 Animais da Fazenda 🐴</h1>
  <p class="instructions">Observe a foto e <strong>clique nas letras</strong> para formar o nome do animal.</p>

  <div class="card" id="card">
    <div class="progress" id="progress"></div>
    <div class="photo-wrap">
      <img id="animalPhoto" alt="">
    </div>

    <div class="slots" id="slots"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="letters" id="letters"></div>

    <div class="controls">
      <button class="control" id="resetBtn">↺ Recomeçar palavra</button>
      <button class="control next" id="nextBtn" disabled>Próximo animal →</button>
    </div>
  </div>

  <div class="tip">💡 A letra errada não fica no quadrinho. Tente outra!</div>
</div>

let current = 0;
let answer = "";
let used = new Set();

const photo = document.getElementById("animalPhoto");
const slots = document.getElementById("slots");
const letters = document.getElementById("letters");
const feedback = document.getElementById("feedback");
const progress = document.getElementById("progress");
const nextBtn = document.getElementById("nextBtn");
const card = document.getElementById("card");

function shuffle(array) {
  const a = [...array];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function loadAnimal() {
  const animal = animals[current];
  answer = "";
  used = new Set();

  photo.src = animal.image;
  photo.alt = "Foto de " + animal.word.toLowerCase();
  progress.textContent = `Animal ${current + 1} de ${animals.length}`;
  feedback.textContent = "";
  feedback.className = "feedback";
  nextBtn.disabled = true;
  card.classList.remove("celebrate");

  slots.innerHTML = "";
  for (let i = 0; i < animal.word.length; i++) {
    const slot = document.createElement("div");
    slot.className = "slot";
    slot.id = "slot-" + i;
    slots.appendChild(slot);
  }

  letters.innerHTML = "";
  shuffle([...animal.word]).forEach((char, index) => {
    const btn = document.createElement("button");
    btn.className = "letter";
    btn.textContent = char;
    btn.setAttribute("aria-label", "Letra " + char);
    btn.dataset.index = index;
    btn.addEventListener("click", () => chooseLetter(char, btn));
    letters.appendChild(btn);
  });
}

function chooseLetter(char, btn) {
  const word = animals[current].word;
  const nextChar = word[answer.length];

  if (char !== nextChar) {
    btn.classList.remove("wrong");
    void btn.offsetWidth;
    btn.classList.add("wrong");
    feedback.textContent = "Essa não é a próxima letra. Tente outra! 😊";
    feedback.className = "feedback no";
    setTimeout(() => btn.classList.remove("wrong"), 300);
    return;
  }

  answer += char;
  used.add(btn.dataset.index);
  btn.classList.add("used");
  btn.disabled = true;

  const slot = document.getElementById("slot-" + (answer.length - 1));
  slot.textContent = char;
  slot.classList.add("filled");

  feedback.textContent = "Muito bem! ⭐";
  feedback.className = "feedback ok";

  if (answer === word) {
    feedback.textContent = "🎉 Muito bem! Você formou " + word + "!";
    feedback.className = "feedback ok";
    nextBtn.disabled = false;
    card.classList.add("celebrate");
  }
}

function resetWord() {
  loadAnimal();
}

function nextAnimal() {
  if (current < animals.length - 1) {
    current++;
    loadAnimal();
  } else {
    current = 0;
    loadAnimal();
    feedback.textContent = "🌟 Você completou todos! Vamos brincar novamente!";
    feedback.className = "feedback ok";
  }
}

document.getElementById("resetBtn").addEventListener("click", resetWord);
nextBtn.addEventListener("click", nextAnimal);

loadAnimal();
</script>
